# ── Tag AMIs ─────────────────────────────────────────────────────────────────
  tag-release:
    name: Tag AMIs with release version
    needs: [test-x86-base, test-x86-pro, test-arm-base, test-arm-pro]
    if: |
      always() &&
      github.event.inputs.version_tag != '' &&
      (needs.test-x86-base.result == 'success' || needs.test-x86-base.result == 'skipped') &&
      (needs.test-x86-pro.result == 'success' || needs.test-x86-pro.result == 'skipped') &&
      (needs.test-arm-base.result == 'success' || needs.test-arm-base.result == 'skipped') &&
      (needs.test-arm-pro.result == 'success' || needs.test-arm-pro.result == 'skipped') &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c  # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Tag all built AMIs
        env:
          VERSION: ${{ github.event.inputs.version_tag }}
        run: |
          REGION="${AWS_DEFAULT_REGION}"

          tag_ami() {
            local ami_id="$1"
            local label="$2"
            [[ -z "$ami_id" || "$ami_id" == "null" ]] && return 0
            aws ec2 create-tags \
              --resources "$ami_id" \
              --tags \
                "Key=Version,Value=${VERSION}" \
                "Key=ReleasedAt,Value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                "Key=Pipeline,Value=ami-build" \
                "Key=Label,Value=${label}" \
              --region "$REGION"
            echo "Tagged ${ami_id} (${label}) with ${VERSION}"
          }

          tag_ami "${{ needs.test-x86-base.outputs.ami_id }}" "x86-base"
          tag_ami "${{ needs.test-x86-pro.outputs.ami_id }}"  "x86-pro"
          tag_ami "${{ needs.test-arm-base.outputs.ami_id }}" "arm-base"
          tag_ami "${{ needs.test-arm-pro.outputs.ami_id }}"  "arm-pro"
