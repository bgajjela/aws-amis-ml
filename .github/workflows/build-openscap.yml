name: Build OpenSCAP

on:
  workflow_dispatch:  # Manual trigger
  push:
    paths:
      - '.github/workflows/build-openscap.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    name: Build OpenSCAP from source

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git \
            libxml2-dev libxslt1-dev \
            libapt-pkg-dev libcurl4-openssl-dev \
            libgcrypt-dev libdbus-1-dev \
            libcap-dev libselinux1-dev \
            libxmlsec1-dev libxmlsec1-openssl \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Clone and build OpenSCAP
        run: |
          mkdir -p /tmp/openscap-src
          cd /tmp/openscap-src
          git clone https://github.com/OpenSCAP/openscap.git .
          mkdir -p build
          cd build
          cmake .. -DCMAKE_INSTALL_PREFIX=/usr/local -DENABLE_PYTHON=OFF
          make -j$(nproc)
          sudo make install
          sudo ldconfig

      - name: Verify oscap binary (x86_64)
        run: /usr/local/bin/oscap --version

      - name: Build OpenSCAP for ARM64 (cross-compile)
        run: |
          mkdir -p /tmp/openscap-arm64-src
          cd /tmp/openscap-arm64-src
          git clone https://github.com/OpenSCAP/openscap.git .
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DENABLE_PYTHON=OFF
          make -j$(nproc)
          mkdir -p /tmp/oscap-arm64/usr/local/bin
          cp bin/oscap /tmp/oscap-arm64/usr/local/bin/oscap-arm64

      - name: Create tarballs
        run: |
          # x86_64 tarball
          mkdir -p /tmp/oscap-x86/usr/local/bin
          strip /usr/local/bin/oscap -o /tmp/oscap-x86/usr/local/bin/oscap 2>/dev/null || cp /usr/local/bin/oscap /tmp/oscap-x86/usr/local/bin/
          cd /tmp/oscap-x86 && tar cf /tmp/openscap-ubuntu2204-x86_64.tar usr/

          # ARM64 tarball
          mkdir -p /tmp/oscap-arm64/usr/local/bin
          aarch64-linux-gnu-strip /tmp/oscap-arm64/usr/local/bin/oscap-arm64 -o /tmp/oscap-arm64/usr/local/bin/oscap 2>/dev/null || mv /tmp/oscap-arm64/usr/local/bin/oscap-arm64 /tmp/oscap-arm64/usr/local/bin/oscap
          cd /tmp/oscap-arm64 && tar cf /tmp/openscap-ubuntu2204-arm64.tar usr/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="openscap-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" \
            /tmp/openscap-ubuntu2204-x86_64.tar \
            /tmp/openscap-ubuntu2204-arm64.tar \
            --title "OpenSCAP Build for Ubuntu 22.04" \
            --notes "Pre-built OpenSCAP binaries for x86_64 and ARM64. Extract to / on target system." \
            --repo "${{ github.repository }}"
          echo "OPENSCAP_RELEASE=$TAG" >> $GITHUB_ENV

      - name: Output release info
        run: |
          echo "OpenSCAP release: ${{ env.OPENSCAP_RELEASE }}"
          echo "x86_64 URL: https://github.com/${{ github.repository }}/releases/download/${{ env.OPENSCAP_RELEASE }}/openscap-ubuntu2204-x86_64.tar"
          echo "ARM64 URL: https://github.com/${{ github.repository }}/releases/download/${{ env.OPENSCAP_RELEASE }}/openscap-ubuntu2204-arm64.tar"
