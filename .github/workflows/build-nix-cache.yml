name: Build Cache (x86_64)

on:
  push:
    branches:
      - main
    paths:
      - 'nix/flake.nix'
      - 'nix/flake.lock'
      - '.github/workflows/build-nix-cache.yml'
  schedule:
    # Weekly rebuild: Sunday 2am UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

concurrency:
  group: build-nix-cache-main
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  build-nix-cache-x86:
    if: github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]'
    name: Build Nix cache x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Mask sensitive values
        run: |
          echo "::add-mask::${{ github.repository }}"
          echo "::add-mask::${{ github.workspace }}"

      - name: Install Nix (x86_64 only)
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            extra-experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            system = x86_64-linux

      - name: Setup Cachix (binary cache)
        uses: cachix/cachix-action@v15
        with:
          name: cpu-ds-ml
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        continue-on-error: true

      - name: Build Python 3.11 base environment
        run: |
          nix build --extra-experimental-features nix-command --extra-experimental-features flakes \
            --max-jobs auto --cores 0 \
            -o /tmp/py-base \
            ./nix#py-base --print-build-logs 2>&1 | tee /tmp/py-base.log

      - name: Build Python 3.12 base environment
        run: |
          nix build --extra-experimental-features nix-command --extra-experimental-features flakes \
            --max-jobs auto --cores 0 \
            -o /tmp/py-base-py312 \
            ./nix#py-base-py312 --print-build-logs 2>&1 | tee /tmp/py-base-py312.log

      - name: Build Python 3.13 base environment
        run: |
          nix build --extra-experimental-features nix-command --extra-experimental-features flakes \
            --max-jobs auto --cores 0 \
            -o /tmp/py-base-py313 \
            ./nix#py-base-py313 --print-build-logs 2>&1 | tee /tmp/py-base-py313.log

      - name: Build language toolchains (parallel)
        run: |
          nix build --extra-experimental-features nix-command --extra-experimental-features flakes \
            --max-jobs auto --cores 0 \
            ./nix#python313 ./nix#julia ./nix#R ./nix#go ./nix#java ./nix#spark \
            ./nix#rustc ./nix#cargo ./nix#nodejs --print-build-logs 2>&1 | tee /tmp/langs.log

      - name: Smoke test Python environments
        run: |
          /tmp/py-base/bin/python -c "import numpy, scipy, pandas, sklearn, pyarrow, polars, fastapi, uvicorn, pyspark, PIL, skimage; print('py311 ok')"
          /tmp/py-base-py312/bin/python -c "import numpy, scipy, pandas, sklearn, pyarrow, polars, fastapi, uvicorn, pyspark, PIL, skimage; print('py312 ok')"
          /tmp/py-base-py313/bin/python -c "import numpy, scipy, pandas, sklearn, pyarrow, polars, fastapi, uvicorn, pyspark, PIL, skimage; print('py313 ok')"

      - name: Smoke test language toolchains
        run: |
          nix run ./nix#python313 -- --version
          nix run ./nix#julia -- -e 'println(VERSION)'
          nix run ./nix#R -- --version | head -1
          nix run ./nix#go -- version
          nix run ./nix#java -- -version
          nix run ./nix#rustc -- --version
          nix run ./nix#cargo -- --version
          nix run ./nix#nodejs -- --version

      - name: Push to Cachix
        if: always()
        run: |
          echo "To push to Cachix, run:"
          echo "  nix flake show"
          echo "  cachix push cpu-ds-ml ./result"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nix-build-logs-x86
          path: /tmp/*.log
          retention-days: 3

      - name: Notify on completion
        if: always()
        run: |
          echo ""
          echo "════════════════════════════════════════════════════════════════"
          echo "✅ Nix cache build complete (x86_64)"
          echo "════════════════════════════════════════════════════════════════"
          echo ""
          echo "Cache uploaded to: https://cpu-ds-ml.cachix.org"
          echo "AMI trigger step is currently disabled for this workflow."
          echo "════════════════════════════════════════════════════════════════"

      - name: Trigger AMI Build & Test workflow
        if: false
        run: |
          echo "Triggering ami-build.yml..."
          gh workflow run ami-build.yml \
            --field target=base \
            --field region=us-east-1 \
            --ref main
          echo ""
          echo "✅ AMI build triggered!"
          echo "Track progress at: https://github.com/${{ github.repository }}/actions/workflows/ami-build.yml"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
