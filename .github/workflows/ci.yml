name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  lint-and-test:
    name: Lint, CIS check, CVE scan
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Install trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin v0.70.0

      - name: Install packer
        run: |
          curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update && sudo apt-get install -y packer

      - name: ShellCheck
        run: |
          shellcheck -S warning harden.sh \
            scripts/ami-finalize.sh \
            scripts/ami-scan.sh \
            scripts/build-base-envs.sh \
            scripts/build-pro-envs.sh \
            scripts/tune-pro.sh \
            scripts/smoke-pro.sh \
            scripts/spark-java.sh

      - name: CIS compliance check
        run: bash tests/cis-check.sh

      - name: Trivy — CVE + secret + misconfiguration scan (SARIF)
        run: |
          trivy fs \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format sarif \
            --output trivy-results.sarif \
            .

      - name: Upload Trivy SARIF to code-scanning
        uses: github/codeql-action/upload-sarif@b0565cb28b456da32509aef995361ffcc63f40b0  # v3.28.15
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Packer validate
        run: |
          packer init .
          packer validate \
            -var subnet_id=subnet-placeholder \
            -var security_group_id=sg-placeholder \
            .

      - name: Checkov — Packer IaC misconfiguration scan
        uses: bridgecrewio/checkov-action@37026823bd2a0a70f8aedd88f8a3e9cb342418af  # v12
        with:
          file: packer.pkr.hcl
          framework: terraform
          soft_fail: false
          quiet: true
